<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map Key</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  body{
    font-family: "Times New Roman", Times, serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
    color: #000;
    background: #fff;
    line-height: 1.5;
  }
  h1{
    font-size: 26px;
    border-bottom: 2px solid #000;
    padding-bottom: 8px;
    margin-bottom: 4px;
  }
  p.intro{
    font-size: 16px;
    margin-top: 0;
    margin-bottom: 20px;
  }
  #map{
    height: 600px;
    width: 100%;
    border: 1px solid #000;
  }
  .leaflet-popup-content{
    font-family: "Times New Roman", Times, serif;
    font-size: 15px;
  }
  .leaflet-popup-content a{
    color: #0000EE;
  }
</style>
</head>
<body>

<h1>Swabia 1:86.4k — Map Key</h1>
<p class="intro">Bohnenberger's 1798&ndash;1828 survey of Swabia (Charte von Schwaben), 1:86,400. Each square marks the approximate area covered by one sheet &mdash; click a square to see which sheet it is and open it.</p>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  /* ============================================================
     EDIT THIS LIST to add, remove, or move sheet squares.

     Each sheet needs:
       title  — shown in the popup
       url    — where the square links to
       bounds — the corners of the square, as
                [[southLat, westLng], [northLat, eastLng]]

     HOW TO FIND COORDINATES FOR A REAL SHEET:
     1. Go to google.com/maps
     2. Right-click the sheet's south-west corner on the map,
        click the coordinates that pop up to copy them (lat, lng)
     3. Do the same for the north-east corner
     4. Paste both into a sheet's "bounds" below

     The starting point (map center + zoom) is set further down
     in the script, under "INITIAL MAP VIEW".
     ============================================================ */
  const sheets = [
    { title: "Sheet 1 — Weißenburg", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=2", bounds: [[48.8405, 7.5528], [49.1539, 7.96]] },
    { title: "Sheet 2 — Rastatt", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=3", bounds: [[48.8405, 7.96], [49.1539, 8.3672]] },
    { title: "Sheet 3 — Karlsruhe", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=4", bounds: [[48.8405, 8.3672], [49.1539, 8.7744]] },
    { title: "Sheet 4 — Ludwigsburg", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=5", bounds: [[48.8405, 8.7744], [49.1539, 9.1816]] },
    { title: "Sheet 5 — Heilbronn", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=6", bounds: [[48.8405, 9.1816], [49.1539, 9.5888]] },
    { title: "Sheet 6 — Hall", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=7", bounds: [[48.8405, 9.5888], [49.1539, 9.996]] },
    { title: "Sheet 7 — Ellwangen", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=8", bounds: [[48.8405, 9.996], [49.1539, 10.4032]] },
    { title: "Sheet 8 — Nördlingen", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=9", bounds: [[48.8405, 10.4032], [49.1539, 10.8104]] },
    { title: "Sheet 9 — Pappenheim", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=10", bounds: [[48.8405, 10.8104], [49.1539, 11.2176]] },
    { title: "Sheet 10 — Strassburg", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=11", bounds: [[48.5271, 7.5528], [48.8405, 7.96]] },
    { title: "Sheet 11 — Baden", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=12", bounds: [[48.5271, 7.96], [48.8405, 8.3672]] },
    { title: "Sheet 12 — Calw", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=13", bounds: [[48.5271, 8.3672], [48.8405, 8.7744]] },
    { title: "Sheet 13 — Stuttgart", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=14", bounds: [[48.5271, 8.7744], [48.8405, 9.1816]] },
    { title: "Sheet 14 — Kirchheim", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=15", bounds: [[48.5271, 9.1816], [48.8405, 9.5888]] },
    { title: "Sheet 15 — Göppingen", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=16", bounds: [[48.5271, 9.5888], [48.8405, 9.996]] },
    { title: "Sheet 16 — Heidenheim", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=17", bounds: [[48.5271, 9.996], [48.8405, 10.4032]] },
    { title: "Sheet 17 — Dillingen", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=18", bounds: [[48.5271, 10.4032], [48.8405, 10.8104]] },
    { title: "Sheet 18 — Rain", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=19", bounds: [[48.5271, 10.8104], [48.8405, 11.2176]] }
  ];
  /* ============================================================ */

  // ---- INITIAL MAP VIEW ----
  // [latitude, longitude], zoom level (higher = closer in)
  const map = L.map('map').setView([48.4, 9.6], 8);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  sheets.forEach(sheet => {
    const rect = L.rectangle(sheet.bounds, {
      color: '#9c4a2e',
      weight: 2,
      fillOpacity: 0.15
    }).addTo(map);

    rect.bindPopup(
      `<strong>${sheet.title}</strong><br><a href="${sheet.url}" target="_blank" rel="noopener noreferrer">View sheet →</a>`
    );

    rect.on('mouseover', () => rect.setStyle({ fillOpacity: 0.35 }));
    rect.on('mouseout', () => rect.setStyle({ fillOpacity: 0.15 }));
  });
</script>

</body>
</html>
