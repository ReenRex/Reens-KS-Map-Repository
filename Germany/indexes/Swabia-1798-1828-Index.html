    font-family: "Times New Roman", Times, serif;

  }
  .leaflet-popup-content a{

<body>

<h1>Swabia 1:86.4k — Map Key</h1>
<p class="intro">Bohnenberger's 1798&ndash;1828 survey of Swabia (Charte von Schwaben), 1:86,400. Each square marks the approximate area covered by one sheet &mdash; click a square to see which sheet it is and open it.</p>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

     EDIT THIS LIST to add, remove, or move sheet squares.

     Each sheet needs:
       title  — shown in the popup
       url    — where the square links to
       bounds — the corners of the square, as
                [[southLat, westLng], [northLat, eastLng]]

     HOW TO FIND COORDINATES FOR A REAL SHEET:
     1. Go to google.com/maps
     2. Right-click the sheet's south-west corner on the map,
        click the coordinates that pop up to copy them (lat, lng)
     3. Do the same for the north-east corner
     4. Paste both into a sheet's "bounds" below

     The starting point (map center + zoom) is set further down
     in the script, under "INITIAL MAP VIEW".
     ============================================================ */

    { title: "Sheet 38 — Wutach", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=39", bounds: [[47.6049, 7.96], [47.9183, 8.3672]] },

    { title: "Sheet 52 — Immenstadt", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=53", bounds: [[47.2915, 9.996], [47.6049, 10.4032]] },
    { title: "Sheet 53 — Füssen", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=54", bounds: [[47.2915, 10.4032], [47.6049, 10.8104]] },
  ];
  /* ============================================================ */

  // ---- INITIAL MAP VIEW ----
  // [latitude, longitude], zoom level (higher = closer in)
  const map = L.map('map').setView([48.3, 9.3], 8);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  sheets.forEach(sheet => {
    const rect = L.rectangle(sheet.bounds, {
      color: '#9c4a2e',
      weight: 2,
      fillOpacity: 0.15
    }).addTo(map);

    rect.bindPopup(
      `<strong>${sheet.title}</strong><br><a href="${sheet.url}" target="_blank" rel="noopener noreferrer">View sheet →</a>`
    );

    rect.on('mouseover', () => rect.setStyle({ fillOpacity: 0.35 }));
    rect.on('mouseout', () => rect.setStyle({ fillOpacity: 0.15 }));
  });
</script>

</body>
</html>
