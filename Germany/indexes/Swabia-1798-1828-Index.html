<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map Key</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  body{ font-family: "Times New Roman", Times, serif; }
</style>
</head>
<body>
<h1>Swabia 1:86.4k — Map Key</h1>
<p class="intro">test</p>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
   const sheets = [
    { title: "Sheet 1 — Weißenburg", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=2", bounds: [[48.8405, 7.5528], [49.1539, 7.96]] },
    { title: "Sheet 2 — Rastatt", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=3", bounds: [[48.8405, 7.96], [49.1539, 8.3672]] },
    { title: "Sheet 3 — Karlsruhe", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=4", bounds: [[48.8405, 8.3672], [49.1539, 8.7744]] },
    { title: "Sheet 4 — Ludwigsburg", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=5", bounds: [[48.8405, 8.7744], [49.1539, 9.1816]] },
    { title: "Sheet 5 — Heilbronn", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=6", bounds: [[48.8405, 9.1816], [49.1539, 9.5888]] },
    { title: "Sheet 6 — Hall", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=7", bounds: [[48.8405, 9.5888], [49.1539, 9.996]] },
    { title: "Sheet 7 — Ellwangen", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=8", bounds: [[48.8405, 9.996], [49.1539, 10.4032]] },
    { title: "Sheet 8 — Nördlingen", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=9", bounds: [[48.8405, 10.4032], [49.1539, 10.8104]] },
    { title: "Sheet 9 — Pappenheim", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=10", bounds: [[48.8405, 10.8104], [49.1539, 11.2176]] },
    { title: "Sheet 10 - Strassburg", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=11", bounds: [[48.5255, 7.5838], [48.8369, 7.9695]] },
    { title: "Sheet 11 - Baden", url: "https://opendigi.ub.uni-tuebingen.de/opendigi/FhXIV1a_qt#p=12", bounds: [[48.5390, 7.9714], [48.8521, 8.3830]] },
  ];

  const map = L.map('map').setView([48.4, 9.6], 8);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  sheets.forEach(sheet => {
    const rect = L.rectangle(sheet.bounds, {
      color: '#9c4a2e',
      weight: 2,
      fillOpacity: 0.15
    }).addTo(map);

    rect.bindPopup(
      `<strong>${sheet.title}</strong><br><a href="${sheet.url}" target="_blank" rel="noopener noreferrer">View sheet →</a>`
    );

    rect.on('mouseover', () => rect.setStyle({ fillOpacity: 0.35 }));
    rect.on('mouseout', () => rect.setStyle({ fillOpacity: 0.15 }));
  });
</script>
</body>
</html>
